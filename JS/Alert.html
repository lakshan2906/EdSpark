<!DOCTYPE html>
<html>

<head>
  <title>Alert Message Example</title>
  <style>
    .am button {
      background-color: brown;
      color: aliceblue;
    }
  </style>
</head>

<body>
  <h1>Click the Button</h1>

  <button id="sample">Click Me</button>
  <br>
  <div class="am">
    <button onclick="S_Alert()">Click </button>
  </div>
  <script>
    sample.onclick = () => {
      alert("Hello! This is an alert message.");
    }
    function S_Alert() {
      alert("welcome to AVC");
    }
  </script>
</body>

</html>
